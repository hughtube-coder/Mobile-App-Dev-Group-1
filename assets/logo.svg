<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#D4A537" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1E1E" />
      <stop offset="100%" stop-color="#3D0B0B" />
    </linearGradient>
  </defs>
  <!-- Outer Shield Ring -->
  <circle cx="50" cy="50" r="46" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4" />
  <!-- Shield Studs -->
  <circle cx="50" cy="8" r="2.5" fill="url(#goldGrad)" />
  <circle cx="50" cy="92" r="2.5" fill="url(#goldGrad)" />
  <circle cx="8" cy="50" r="2.5" fill="url(#goldGrad)" />
  <circle cx="92" cy="50" r="2.5" fill="url(#goldGrad)" />
  <circle cx="20" cy="20" r="2" fill="url(#goldGrad)" />
  <circle cx="80" cy="20" r="2" fill="url(#goldGrad)" />
  <circle cx="20" cy="80" r="2" fill="url(#goldGrad)" />
  <circle cx="80" cy="80" r="2" fill="url(#goldGrad)" />
  <!-- D20 Polyhedral Face Outline -->
  <polygon points="50,18 78,35 78,65 50,82 22,65 22,35" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- D20 Inner Triangles -->
  <polygon points="50,18 50,45 22,35" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <polygon points="50,18 50,45 78,35" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <polygon points="50,45 78,35 78,65" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <polygon points="50,45 50,82 78,65" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <polygon points="50,45 50,82 22,65" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <polygon points="50,45 22,35 22,65" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <!-- Viking Horns -->
  <path d="M 24 38 Q 12 25 10 10 Q 18 16 28 28 Z" fill="url(#goldGrad)" />
  <path d="M 76 38 Q 88 25 90 10 Q 82 16 72 28 Z" fill="url(#goldGrad)" />
  <!-- Center Rune V (for Vikings) -->
  <path d="M 44 48 L 50 60 L 56 48" fill="none" stroke="#FFE082" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
